[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otsumobita-keepalive"
version = "0.1.0"
description = "在同一个输入里两两比对，检测长连接的心跳保活相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "otsumobita" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://otsumobita.github.io"
Repository = "https://github.com/otsumobita/keepalive"
Issues = "https://github.com/otsumobita/keepalive/issues"

[project.scripts]
keepalive = "keepalive:main"

[tool.setuptools]
py-modules = ["keepalive"]
